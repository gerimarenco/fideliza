[build]
  # DATABASE_URL solo está configurada para el contexto de Producción, no
  # para Deploy Previews ni Branch deploys. Ahí no corremos las migraciones
  # (fallarían con P1012 igual, tirando abajo el build entero) -- el build
  # de Next no necesita conexión a la base, así que el preview igual sirve
  # para revisar el código y los cambios de UI.
  command = "if [ -n \"$DATABASE_URL\" ]; then prisma migrate deploy; fi && prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Funciones propias (ver netlify/functions/) además de las que arma
  # @netlify/plugin-nextjs para las rutas de la app — no interfieren entre sí.
  # El horario de regalo-cumpleanos se declara en el propio archivo de la
  # función (export const config), no acá.
  directory = "netlify/functions"
  # El motor nativo de Prisma es un binario, no JS: hay que empaquetarlo tal
  # cual en vez de que el bundler (esbuild) intente procesarlo como código.
  # @netlify/plugin-nextjs ya resuelve esto solo para las rutas de la app;
  # las funciones propias necesitan esta línea aparte.
  included_files = ["node_modules/.prisma/client/**"]